<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | MotoArmor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1b1f22;
      color: #fff;
    }
    .contact-section {
      padding: 60px 20px;
      background: linear-gradient(to right, #101214, #2e3439);
      text-align: center;
    }
    .contact-section h1 {
      font-size: 42px;
      font-weight: bold;
      color: #f7931e;
      margin-bottom: 20px;
    }
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      background: #2a2e31;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .form-label {
      font-weight: bold;
      color: #f0f0f0;
    }
    .btn-primary {
      background-color: #f7931e;
      border: none;
    }
    .btn-primary:hover {
      background-color: #ffa733;
    }
    .footer {
      background-color: #111;
      color: #ccc;
      padding: 20px 0;
      text-align: center;
    }
    a {
      color: #f7931e;
      text-decoration: none;
    }
    a:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <section class="contact-section">
    <h1>Contact Us</h1>
    <p class="mb-5">We’d love to hear from you. Whether you have a question about customization, pricing, or anything else — our team is ready to answer all your questions.</p>

    <div class="form-container">
      <form id="contactForm" onsubmit="sendToWhatsApp(); return false;">
        <div class="mb-3 text-start">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
        </div>
        <div class="mb-3 text-start">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3 text-start">
          <label for="whatsapp" class="form-label">WhatsApp Number</label>
          <input type="text" class="form-control" id="whatsapp" placeholder="+92123456789" required>
        </div>
        <div class="mb-3 text-start">
          <label for="message" class="form-label">Your Message</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Type your message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Message</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 MotoArmor. All rights reserved.</p>
    <p><a href="index.html">Back to Home</a> | <a href="About.html">About Us</a></p>
  </footer>

  <script>
    function sendToWhatsApp() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const whatsapp = document.getElementById('whatsapp').value;
   
      const message = document.getElementById('message').value;

      const whatsappMessage = `*New Contact Query from RideGear Website*\n\n*Name:* ${name}\n*Email:* ${email}\n*WhatsApp:* ${whatsapp}\n*Message:* ${message}`;
      
      const encodedMessage = encodeURIComponent(whatsappMessage);
      const whatsappNumber = "923001234567"; // ✅ Replace with YOUR number (no +)
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
      window.open(whatsappURL, '_blank');
    }
  </script>

</body>
</html>
